name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily — publishes posts whose date has arrived
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate blog posts
        run: python3 _build/validate.py
      - name: Build site
        run: python3 _build/build.py
      - name: Assemble deployable files
        run: |
          mkdir _site
          rsync -a --exclude '_site' --exclude '_build' --exclude 'content' --exclude '.git*' \
            --exclude '.claude' --exclude 'CLAUDE.md' --exclude 'README.md' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
